name: FishLens CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    # A temporary MongoDB for the backend tests, deleted when the job ends.
    # It never touches the real Atlas database.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        # Wait until MongoDB answers before the steps start.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          DJANGO_SECRET_KEY: test-only-not-a-real-secret
        run: python manage.py test --noinput

      - name: Show MongoDB logs if the tests failed
        if: failure()
        run: docker logs "${{ job.services.mongodb.id }}"

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Deploy to Vercel
        run: |
          npx vercel@65.11.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
