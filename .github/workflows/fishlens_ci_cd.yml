name: FishLens CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    # A temporary MongoDB for the backend tests, deleted when the job ends.
    # It never touches the real Atlas database.
    services:
      mongodb:
        # 9.0, because 8.0 won't start on the newer Linux that GitHub's runners use.
        image: mongo:9.0
        ports:
          - 27017:27017
        # Wait until MongoDB answers before the steps start.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          DJANGO_SECRET_KEY: test-only-not-a-real-secret
        run: python manage.py test --noinput

      - name: Show MongoDB logs if the tests failed
        if: failure()
        run: docker logs "${{ job.services.mongodb.id }}"

  # User Story 6.2: runs the golden set against the real Claude and fails the
  # check if the AI's answers fall below the thresholds or drift from
  # backend/evals/baseline.json. Each run costs money, so it only runs on pull
  # requests that change something that can affect the AI's answers. Other
  # pull requests pass this check without calling the API.
  eval:
    name: Eval
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, so the next step can see what the PR changed

      - name: Check whether this PR changes the AI feature
        id: ai
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if echo "$files" | grep -qE '^(backend/(prompts|chat|evals)/|backend/requirements\.txt$|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No AI-related files changed, so the eval is skipped (no API cost)."
          fi

      - name: Install Python
        if: steps.ai.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        if: steps.ai.outputs.changed == 'true'
        run: pip install -r backend/requirements.txt

      - name: Run the eval suite
        if: steps.ai.outputs.changed == 'true'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: claude-sonnet-5-5
          FISH_CHAT_PROMPT_VERSION: v2
        run: python evals/run_evals.py

      - name: Upload eval results
        if: always() && steps.ai.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: backend/evals/results.json

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.34.3

      - name: Deploy to Vercel
        run: |
          npx vercel@65.11.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
