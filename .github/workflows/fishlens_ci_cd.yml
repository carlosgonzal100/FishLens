name: FishLens CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Setup - Checkout code
        uses: actions/checkout@v7

      - name: Setup - Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Setup - Checkout code
        uses: actions/checkout@v7

      - name: Setup - Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Vercel
        run: |
          npx vercel@65.11.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@65.11.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
